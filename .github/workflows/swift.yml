name: Swift CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Build release executable
        run: swift build -c release
      - name: Run parser regression tests
        run: swift run -c release twofa --self-test
